<style>

/* Layout: one column ledger. Header with group switcher, summary strip, tabs (帳目 / 結算 / 成員與匯率), modal sheet for new expense. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --line:#d9e2dd; --fg:#1b2a24; --muted:#5f7068;
  --accent:#17705a; --accent-ink:#ffffff; --accent-soft:#e1f0ea;
  --owe:#b5462f; --owe-soft:#f8e6e1; --get:#17705a; --get-soft:#e1f0ea;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 8px 24px rgba(20,40,30,.06);
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18221f; --line:#2b3934; --fg:#e4ece8; --muted:#97a8a0;
  --accent:#4fbf9c; --accent-ink:#0d1714; --accent-soft:#1d3a31;
  --owe:#ef8a72; --owe-soft:#3a2420; --get:#4fbf9c; --get-soft:#1d3a31;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18221f; --line:#2b3934; --fg:#e4ece8; --muted:#97a8a0;
  --accent:#4fbf9c; --accent-ink:#0d1714; --accent-soft:#1d3a31;
  --owe:#ef8a72; --owe-soft:#3a2420; --get:#4fbf9c; --get-soft:#1d3a31;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 110px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:28px;letter-spacing:.02em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--fg)}
.btn-sm{padding:4px 10px;font-size:13px}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 140px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.switcher{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.switcher select{width:auto;max-width:60vw}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.summary>div{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.summary .k{font-size:12px;color:var(--muted);letter-spacing:.06em}
.summary .v{font-size:20px}
.gtitle{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--muted);padding:8px 12px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
.list{display:flex;flex-direction:column}
.exp{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:none}
.date{font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.date b{display:block;font-family:var(--f-num);font-size:18px;color:var(--fg);font-weight:500}
.exp .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.exp .s{font-size:13px;color:var(--muted)}
.exp .amt{text-align:right}
.exp .amt small{display:block;font-size:12px;color:var(--muted)}
.exp.transfer .t{color:var(--muted);font-weight:400}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.bal{display:grid;grid-template-columns:minmax(70px,auto) 1fr minmax(90px,auto);gap:10px;align-items:center;padding:8px 0}
.bar{height:10px;position:relative;background:var(--bg);border-radius:6px}
.bar span{position:absolute;top:0;bottom:0;border-radius:6px}
.bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.pos{color:var(--get)} .neg{color:var(--owe)}
.xfer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--bg)}
.xfer .arrow{color:var(--muted)}
.xfer .who{font-weight:500}
.xfer .grow{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
h3{font-size:14px;margin:4px 0;color:var(--muted);font-weight:500;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.chip button{padding:0 6px;border:none;background:none;color:var(--muted);font-size:16px;line-height:1}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--owe);font-size:13px;min-height:1.2em}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);padding:12px 20px;border-radius:99px}
.overlay{position:fixed;inset:0;background:rgba(10,20,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:16px}
@media (min-width:640px){.overlay{align-items:center}}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;background:none;padding:6px 14px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.part{display:grid;grid-template-columns:auto 1fr 110px;gap:10px;align-items:center}
.part input[type=checkbox]{width:18px;height:18px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pk{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;padding:12px;border-radius:12px;min-height:64px}
.pk .ck{grid-row:span 2;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700}
.pk .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.pk .sh{font-size:13px;color:var(--muted)}
.pk[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.pk[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pk[aria-pressed="true"] .sh{color:var(--accent)}
@media (max-width:640px){input,select{font-size:16px}}
.rates{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.banner{padding:12px 14px;border-radius:12px;background:var(--owe-soft);color:var(--owe);font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}

[hidden]{display:none!important}
img{max-width:100%}
.seg{max-width:100%}
.seg button{white-space:nowrap}

html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
.status{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;border:none}
.status.off{background:var(--owe-soft);color:var(--owe)}
.code{font-family:var(--f-num);font-size:12px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:96px;overflow:auto;user-select:all}
textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:72px;resize:vertical}
@media (max-width:640px){textarea{font-size:16px}}
</style>

<style>
.krw{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.krw-row{display:flex;align-items:center;gap:10px}
.krw-row label{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:20px;color:var(--muted)}
.krw-row input{font-family:var(--f-num);font-size:22px;padding:8px 10px}
.krw-eq{color:var(--muted)}
.krw-out{flex:1 1 0;min-width:0;font-family:var(--f-num);font-size:22px;color:var(--accent);text-align:right;overflow-wrap:anywhere}
.krw-meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.krw-meta button{font-size:12px;padding:0 6px;border:none;background:none;color:var(--accent);text-decoration:underline}

</style>

<body>
<div class="wrap">
  <header>
    <div class="brand">分分帳 <small>Derek 與 Jade 的帳本</small></div>
    <div class="switcher"><span id="switcher" class="switcher"></span><button id="status" class="status" hidden></button></div>
  </header>
  <!-- TEMP 韓元換算 START -->
  <div class="krw" id="krw">
    <div class="krw-row">
      <label for="krw-in">₩<input id="krw-in" type="text" inputmode="numeric" autocomplete="off" placeholder="輸入韓元"></label>
      <span class="krw-eq">≈</span>
      <div class="krw-out" id="krw-out">NT$ —</div>
    </div>
    <div class="krw-meta"><span id="krw-note">正在取得匯率…</span><button type="button" id="krw-edit">改匯率</button>
      <input id="krw-rate" type="number" inputmode="decimal" step="any" min="0" hidden aria-label="1 韓元等於多少台幣" placeholder="清空=自動"></div>
  </div>
  <!-- TEMP 韓元換算 END -->
  <div id="banner"></div>
  <main id="main" class="stack"><div class="empty">正在載入帳本…</div></main>
</div>
<div id="modal"></div>

<script>
const CURS = ["TWD","JPY","USD","EUR","KRW","HKD","CNY","MOP","THB","SGD","MYR","VND","PHP","IDR","GBP","CHF","AUD","NZD","CAD"];
const NODEC = new Set(["TWD","JPY","KRW","VND"]);
const POLL_MS = 15000;

/* ---------- local storage ---------- */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
let cfg = LS.get("fenfen.cfg", null);           // {api, pin}
let server = LS.get("fenfen.cache", {groups:[], expenses:[]});
let queue = LS.get("fenfen.queue", []);         // pending ops, oldest first

const S = { gid: LS.get("fenfen.gid", null), group:null, groups:[], expenses:[], tab:"list",
  online:true, syncing:false, pinBad:false, dirty:false };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const r2 = n => Math.round(n*100)/100;
function fmt(n, cur){ const d = NODEC.has(cur)?0:2; let v = Math.round(Number(n)*10**d)/10**d; if (v === 0) v = 0; return v.toLocaleString("zh-TW",{minimumFractionDigits:d,maximumFractionDigits:d}); }
const mname = id => (S.group?.members||[]).find(m=>m.id===id)?.name || "（已移除）";

/* ---------- setup code (shared with the other phone) ---------- */
const encodeCfg = c => btoa(unescape(encodeURIComponent(JSON.stringify(c))));
function decodeCfg(s){
  try { const c = JSON.parse(decodeURIComponent(escape(atob(String(s).trim()))));
    if (c && /^https:\/\/script\.google\.com\//.test(c.api) && c.pin) return {api:c.api, pin:String(c.pin)}; } catch(e){}
  return null;
}
(function readHash(){
  const m = location.hash.match(/^#setup=(.+)$/);
  if (!m) return;
  const c = decodeCfg(decodeURIComponent(m[1]));
  if (c){ cfg = c; LS.set("fenfen.cfg", c); }
  history.replaceState(null, "", location.pathname + location.search);
})();

/* ---------- sync ---------- */
function applyOps(base, ops){
  const g = new Map(base.groups.map(x=>[x.id,x])), e = new Map(base.expenses.map(x=>[x.id,x]));
  for (const o of ops){
    if (o.t==="group") g.set(o.doc.id, o.doc);
    else if (o.t==="exp") e.set(o.doc.id, o.doc);
    else if (o.t==="delExp") e.delete(o.id);
  }
  return {groups:[...g.values()], expenses:[...e.values()]};
}
function op(o){
  queue.push(o); LS.set("fenfen.queue", queue);
  refresh(true); flush();
}
async function api(method, body){
  const url = method==="GET" ? cfg.api + "?action=all&pin=" + encodeURIComponent(cfg.pin) : cfg.api;
  const r = await fetch(url, method==="GET" ? {cache:"no-store"} :
    {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({pin:cfg.pin, ...body})});
  const j = await r.json();
  if (!j.ok){ const err = new Error(j.error); err.server = true; throw err; }
  return j.data;
}
function syncFail(e){
  S.online = false;
  S.lastErr = e && e.server ? e.message : null;   // server-side error text, shown instead of a bare "離線"
  if (e && e.server && (e.message==="pin" || e.message==="setup")) S.pinBad = e.message;
}
async function flush(){
  if (!cfg || !queue.length || S.flushing) return;
  S.flushing = true; renderStatus();
  const batch = queue.slice(0, 50);
  try {
    await api("POST", {ops:batch});
    server = applyOps(server, batch); LS.set("fenfen.cache", server);
    queue = queue.slice(batch.length); LS.set("fenfen.queue", queue);
    S.online = true; S.pinBad = false; S.lastErr = null;
  } catch(e){ syncFail(e); }
  S.flushing = false; renderStatus();
  if (S.online && queue.length) flush();
}
async function pull(){
  if (!cfg || S.pulling) return;
  S.pulling = true; renderStatus();
  try {
    const data = await api("GET");
    const next = {groups:data.groups||[], expenses:data.expenses||[]};
    if (JSON.stringify(next) !== JSON.stringify(server)){ server = next; LS.set("fenfen.cache", server); refresh(); }
    S.online = true; S.pinBad = false; S.lastErr = null; S.firstLoad = true;
  } catch(e){ syncFail(e); }
  S.pulling = false; renderStatus();
  if (S.online && queue.length) flush();
}
function sync(){ if (document.visibilityState === "visible"){ flush(); pull(); } }
setInterval(sync, POLL_MS);
document.addEventListener("visibilitychange", sync);
addEventListener("online", sync);

function refresh(force){
  const v = applyOps(server, queue);
  S.groups = v.groups.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if (!S.groups.find(g=>g.id===S.gid)) S.gid = S.groups[0]?.id || null;
  S.group = S.groups.find(g=>g.id===S.gid) || null;
  S.expenses = v.expenses.filter(e=>e.groupId===S.gid)
    .sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
  renderSwitcher();
  // don't wipe a field the person is typing in; render once they leave it
  const a = document.activeElement;
  if (!force && a && $("#main").contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName)){ S.dirty = true; return; }
  render();
}
$("#main").addEventListener("focusout", () => setTimeout(() => { if (S.dirty){ S.dirty = false; render(); } }, 0));

function renderStatus(){
  const b = $("#status");
  if (!cfg){ b.hidden = true; return; }
  b.hidden = false;
  let t, off = false;
  if (S.pinBad === "setup"){ t = "試算表的密碼還沒設定"; off = true; }
  else if (S.pinBad){ t = "密碼錯誤"; off = true; }
  else if (!S.online && S.lastErr){ t = queue.length ? `試算表錯誤 · ${queue.length} 筆待上傳` : "試算表錯誤"; off = true; }
  else if (!S.online){ t = queue.length ? `離線 · ${queue.length} 筆待上傳` : "離線"; off = true; }
  else if (queue.length || S.flushing){ t = "上傳中…"; }
  else if (S.pulling && !S.firstLoad){ t = "同步中…"; }
  else t = "已同步";
  b.textContent = t; b.classList.toggle("off", off);
  $("#banner").innerHTML = !S.online && S.lastErr && !S.pinBad
    ? `<div class="banner">試算表回報錯誤：${esc(S.lastErr)}。點右上角重試；一直出現的話，把這段文字截圖下來。</div>` : "";
  b.onclick = () => sync();
}

/* ---------- exchange rates ---------- */
// Reference rates from the free fawazahmed0 currency API. Returns {date, rates:{CUR: how many base units 1 CUR is worth}}.
async function fx(base){
  const k = "fenfen.fx." + base, cached = LS.get(k, null);
  if (cached && Date.now() - cached.at < 6*3600e3) return cached;
  const b = base.toLowerCase();
  for (const u of [`https://latest.currency-api.pages.dev/v1/currencies/${b}.json`,
                   `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${b}.json`]){
    try {
      const r = await fetch(u, {cache:"no-store"}); if (!r.ok) continue;
      const j = await r.json(), m = j && j[b]; if (!m) continue;
      const rates = {};
      for (const c of CURS){ const v = Number(m[c.toLowerCase()]); if (v > 0) rates[c] = +(1/v).toPrecision(6); }
      const out = {at:Date.now(), date:j.date, rates}; LS.set(k, out); return out;
    } catch(e){}
  }
  return cached;   // stale copy, or null when never fetched
}

/* ---------- display currency (結算幣別) ---------- */
function dispCur(){
  const g = S.group, d = (LS.get("fenfen.disp", {}))[g.id];
  return d && (d === g.base || (g.rates||{})[d] > 0) ? d : g.base;
}
function setDisp(c){ const all = LS.get("fenfen.disp", {}); all[S.group.id] = c; LS.set("fenfen.disp", all); render(); }
const toDisp = (x, d) => d === S.group.base ? x : x / S.group.rates[d];
function dispSwitch(){
  const g = S.group, cs = [g.base, ...Object.keys(g.rates||{})], d = dispCur();
  if (cs.length < 2) return "";
  return `<div class="row" style="align-items:center;gap:8px"><span class="note" style="flex:0 0 auto">金額顯示為</span>
    <div class="seg" style="flex:0 1 auto;overflow-x:auto">${cs.map(c=>`<button type="button" data-disp="${esc(c)}" aria-pressed="${c===d}">${esc(c)}</button>`).join("")}</div></div>`;
}

/* ---------- core math ---------- */
const rateOf = e => e.currency === S.group.base ? 1 : Number(e.rate)||0;
const baseAmt = e => e.amount * rateOf(e);
function shares(e){
  const rate = rateOf(e), out = {};
  if (e.kind === "transfer") return out;
  if (e.mode === "exact") for (const [id,v] of Object.entries(e.exact||{})) out[id] = (Number(v)||0)*rate;
  else { const ps = e.participants||[]; const each = ps.length ? e.amount*rate/ps.length : 0; ps.forEach(id => out[id] = each); }
  return out;
}
function balances(){
  const b = {}; (S.group.members||[]).forEach(m => b[m.id]=0);
  for (const e of S.expenses){
    const amt = baseAmt(e);
    if (e.kind === "transfer"){ b[e.payer]=(b[e.payer]||0)+amt; b[e.to]=(b[e.to]||0)-amt; continue; }
    b[e.payer]=(b[e.payer]||0)+amt;
    for (const [id,v] of Object.entries(shares(e))) b[id]=(b[id]||0)-v;
  }
  return b;
}
function simplify(b){
  const eps = NODEC.has(S.group.base) ? 0.5 : 0.005;
  const cr = [], db = [];
  for (const [id,v] of Object.entries(b)){ if (v>eps) cr.push({id,v}); else if (v<-eps) db.push({id,v:-v}); }
  cr.sort((a,c)=>c.v-a.v); db.sort((a,c)=>c.v-a.v);
  const out = []; let i=0, j=0;
  while (i<db.length && j<cr.length){
    const x = Math.min(db[i].v, cr[j].v);
    out.push({from:db[i].id, to:cr[j].id, amt:r2(x)});
    db[i].v-=x; cr[j].v-=x;
    if (db[i].v<=eps) i++;
    if (cr[j].v<=eps) j++;
  }
  return out;
}

    <form id="ef" class="stack" novalidate>
      <label class="f">品項<input id="e-title" maxlength="60" placeholder="例如：晚餐、計程車" value="${esc(st.title)}"></label>
      <div class="row"><label class="f">金額<input id="e-amt" type="number" inputmode="decimal" step="any" min="0" value="${esc(st.amount)}"></label>
        <label class="f" style="flex:0 1 110px">幣別<select id="e-cur"><optgroup label="這個群組用過">${mine.map(c=>`<option${c===st.currency?" selected":""}>${esc(c)}</option>`).join("")}</optgroup><optgroup label="其他幣別">${others.map(c=>`<option>${esc(c)}</option>`).join("")}</optgroup></select></label></div>
      <div class="row" id="e-rate-row"><label class="f"><span>匯率：1 <span id="e-rc"></span> 等於多少 ${esc(g.base)}</span><input id="e-rate" type="number" inputmode="decimal" step="any" min="0" value="${esc(st.rate)}"></label><div class="note" id="e-conv" style="align-self:center"></div></div>
      <div class="note" id="e-fx" style="margin-top:-8px"></div>
      <div class="row"><label class="f">誰先付的<select id="e-payer">${ms.map(m=>`<option value="${esc(m.id)}"${m.id===st.payer?" selected":""}>${esc(m.name)}</option>`).join("")}</select></label>
        <label class="f">日期<input id="e-date" type="date" value="${esc(st.date)}"></label></div>
      <div class="stack" style="gap:8px"><div class="row" style="align-items:center"><span class="note" style="flex:0 0 auto">分攤方式</span>
        <div class="seg" style="flex:0 0 auto"><button type="button" data-mode="equal">點選平分</button><button type="button" data-mode="exact">自訂金額</button></div>
        <button type="button" class="btn-ghost btn-sm" id="e-all" style="flex:0 0 auto">全選</button></div>
        <div id="e-parts" class="stack" style="gap:6px"></div><div class="note" id="e-sum"></div></div>
      <div class="err" id="e-err"></div>
      <div class="row" style="justify-content:space-between">
        ${e?`<button type="button" class="btn-ghost" id="e-del" style="flex:0 0 auto;color:var(--owe)">刪除</button>`:"<span></span>"}
        <span style="display:flex;gap:8px;flex:0 0 auto"><button type="button" class="btn-ghost" data-close>取消</button><button class="btn-primary">儲存</button></span></div>
    </form>`);

  const exactSum = () => {
    const cur = $("#e-cur").value, amt = parseFloat($("#e-amt").value)||0;
    const sum = st.participants.reduce((s,id)=>s+(parseFloat(st.exact[id])||0),0), left = r2(amt-sum);
    $("#e-sum").innerHTML = `已分配 <span class="num">${fmt(sum,cur)}</span> / <span class="num">${fmt(amt,cur)}</span> ${esc(cur)}${Math.abs(left)>0.004?` · <span class="neg">還差 ${fmt(left,cur)}</span>`:""}`;
  };
  const sync = () => {
    const cur = $("#e-cur").value; $("#e-rc").textContent = cur;
    $("#e-rate-row").hidden = cur === g.base;
    const amt = parseFloat($("#e-amt").value)||0, rate = cur===g.base?1:parseFloat($("#e-rate").value)||0;
    $("#e-conv").textContent = cur===g.base ? "" : `≈ ${fmt(amt*rate,g.base)} ${g.base}`;
    document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mode===st.mode));
    const ps = new Set(st.participants), each = ps.size ? amt/ps.size : 0;
    $("#e-parts").innerHTML = st.mode==="exact"
      ? ms.map(m=>`<label class="part"><input type="checkbox" data-p="${esc(m.id)}"${ps.has(m.id)?" checked":""}><span>${esc(m.name)}</span>
          <input type="number" inputmode="decimal" step="any" min="0" data-x="${esc(m.id)}" value="${esc(st.exact[m.id]??"")}" ${ps.has(m.id)?"":"disabled"} aria-label="${esc(m.name)} 的金額"></label>`).join("")
      : `<div class="pick">${ms.map(m=>`<button type="button" class="pk" data-pk="${esc(m.id)}" aria-pressed="${ps.has(m.id)}">
          <span class="ck" aria-hidden="true">${ps.has(m.id)?"✓":""}</span><span class="nm">${esc(m.name)}</span>
          <span class="num sh">${ps.has(m.id)?fmt(each,cur):"不分攤"}</span></button>`).join("")}</div>`;
    if (st.mode==="exact") exactSum();
    else $("#e-sum").textContent = !ps.size ? "點選要分攤這筆的人"
      : ps.size===1 ? `全部算 ${mname([...ps][0])} 的，共 ${fmt(amt,cur)} ${cur}`
      : `${ps.size} 人平分，每人 ${fmt(each,cur)} ${cur}`;
    $("#e-parts").querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{ const id=b.dataset.pk; st.participants = st.participants.includes(id) ? st.participants.filter(x=>x!==id) : [...st.participants,id]; sync(); });
    $("#e-parts").querySelectorAll("[data-p]").forEach(c=>c.onchange=()=>{ const id=c.dataset.p; st.participants = c.checked ? [...st.participants,id] : st.participants.filter(x=>x!==id); sync(); });
    $("#e-parts").querySelectorAll("[data-x]").forEach(i=>i.oninput=()=>{ st.exact[i.dataset.x]=i.value; exactSum(); });
  };
  $("#e-cur").onchange = async () => {
    const c = $("#e-cur").value, note = $("#e-fx"); note.textContent = "";
    if (c === g.base){ sync(); return; }
    if (rates[c]){ $("#e-rate").value = rates[c]; note.textContent = "使用這個群組設定的匯率。"; sync(); return; }
    $("#e-rate").value = ""; note.textContent = "正在取得參考匯率…"; sync();
    const r = await fx(g.base);
    if ($("#e-cur")?.value !== c) return;   // changed again while loading
    if (r && r.rates[c]){ $("#e-rate").value = r.rates[c]; note.textContent = `參考匯率（${r.date}），可以自己修改。存檔後這個群組之後都會用這個匯率。`; }
    else note.textContent = "抓不到參考匯率，請自己輸入。";
    sync();
  };
  $("#e-amt").oninput = sync; $("#e-rate").oninput = sync;
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ st.mode=b.dataset.mode; sync(); });
  $("#e-all").onclick = () => { st.participants = ms.map(m=>m.id); sync(); };
  if (e) $("#e-del").onclick = () => confirmDelete(e.id, "「"+e.title+"」");
  sync();

  $("#ef").onsubmit = ev => { ev.preventDefault();
    const err = m => { $("#e-err").textContent = m; };
    const title = $("#e-title").value.trim(), amount = r2(parseFloat($("#e-amt").value)), cur = $("#e-cur").value;
    const rate = cur===g.base ? 1 : parseFloat($("#e-rate").value);
    if (!title) return err("請填寫品項。");
    if (!(amount>0)) return err("請填寫大於 0 的金額。");
    if (!(rate>0)) return err(`請填寫 ${cur} 對 ${g.base} 的匯率。`);
    if (!st.participants.length) return err("至少要選一位分攤的人。");
    const doc = { id:e?.id || rid("e"), kind:"expense", title, amount, currency:cur, rate, payer:$("#e-payer").value, date:$("#e-date").value||today(), mode:st.mode, participants:st.participants, createdAt:e?.createdAt||Date.now() };
    if (st.mode==="exact"){
      const ex = {}; let sum = 0; for (const id of st.participants){ const v = r2(parseFloat(st.exact[id])||0); ex[id]=v; sum+=v; }
      if (Math.abs(sum-amount)>0.01) return err(`自訂金額加總 ${fmt(sum,cur)}，跟總金額 ${fmt(amount,cur)} 不一樣。`);
      doc.exact = ex;
    }
    if (cur !== g.base && !(rates[cur] > 0)) saveGroup({...g, rates:{...rates, [cur]:rate}});
    saveExp(doc); closeModal();
    if (S.tab!=="list"){ S.tab="list"; render(); }
  };
}

/* ---------- start ---------- */
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
refresh(true); renderStatus();
if (cfg) sync();
</script>

<script>
(function(){
  const inp = document.getElementById("krw-in"), out = document.getElementById("krw-out"),
        note = document.getElementById("krw-note"), rIn = document.getElementById("krw-rate"), edit = document.getElementById("krw-edit");
  let rate = LS.get("fenfen.krwRate", null), custom = LS.get("fenfen.krwCustom", false);
  const show = d => { note.textContent = rate ? `1 韓元 = ${rate} 台幣${d ? `（${d}）` : ""}` : "抓不到匯率，請按「改匯率」自己輸入"; };
  const calc = () => {
    const raw = String(inp.value).replace(/[^0-9.]/g, "");
    const k = parseFloat(raw);
    if (raw && inp.value !== Number(raw).toLocaleString("en-US") && !raw.includes(".")) inp.value = Number(raw).toLocaleString("en-US");
    out.textContent = k > 0 && rate > 0 ? "NT$ " + (k*rate).toLocaleString("zh-TW", {maximumFractionDigits:1}) : "NT$ —";
  };
  inp.addEventListener("input", calc);
  inp.addEventListener("focus", () => inp.select());
  edit.onclick = () => { rIn.hidden = !rIn.hidden; if (!rIn.hidden){ rIn.value = rate || ""; rIn.focus(); } };
  rIn.oninput = () => { const r = parseFloat(rIn.value);
    if (!rIn.value){ custom = false; LS.set("fenfen.krwCustom", false); fx("TWD").then(x => { if (x && x.rates.KRW) rate = x.rates.KRW; show(x && x.date); calc(); }); return; } if (r > 0){ rate = r; custom = true; LS.set("fenfen.krwRate", r); LS.set("fenfen.krwCustom", true); note.textContent = `1 韓元 = ${r} 台幣（自訂）`; calc(); } };
  show(custom ? "自訂" : "");
  if (!custom) fx("TWD").then(r => { if (r && r.rates.KRW){ rate = r.rates.KRW; LS.set("fenfen.krwRate", rate); } show(r && r.date); calc(); });
})();
</script>
